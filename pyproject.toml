[build-system]
requires = ["poetry-core>=2.1.3", "poetry-dynamic-versioning>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "slowrevpy"
version = "1.5.2"  # Версия из conf.ini
description = "A basic python script to make slowed + reverbs."
authors = ["Artemii Popovkin <angap4@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Jrol123/slowrevpy"
repository = "https://github.com/Jrol123/slowrevpy"
documentation = "https://github.com/Jrol123/slowrevpy"
keywords = ["python", "music", "slowed reverb", "Jrol123"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities"
]
include = ["README.md"]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
pattern = "(?P<base>\\d+(?:\\.\\d+)*)"

[tool.poetry.dependencies]
python = ">=3.9"
pedalboard = "*"
soundfile = "*"
python-ffmpeg = "*"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry.scripts]
slowrevpy = "slowrevpy.__main__:cli"

